<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f2">
  <meta name="description" content="Espacio Ágape, consultorios interdisciplinarios en Colón, Buenos Aires.">
  <title>Espacio Ágape | Consultorios Interdisciplinarios</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #fbf7f2;
      --cream-deep: #f3e8de;
      --pink: #f0d8cc;
      --sage: #dce8d9;
      --sage-dark: #55745b;
      --sage-deep: #3f5d46;
      --ink: #443e38;
      --muted: #756f69;
      --white: #fff;
      --shadow: 0 18px 50px rgba(67,75,61,.09);
      --radius: 26px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.7;
    }

    h1,h2,h3,h4,.navbar-brand {
      font-family: "Nunito", sans-serif;
    }

    h1,h2,h3,h4 {
      color: var(--sage-deep);
      letter-spacing: -.025em;
    }

    a { color: var(--sage-dark); }

    .navbar {
      background: rgba(251,247,242,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(85,116,91,.08);
    }

    .navbar-brand {
      color: var(--sage-deep);
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: var(--sage);
      margin-right: 8px;
      font-size: 1.2rem;
    }

    .nav-link {
      color: var(--ink);
      font-weight: 700;
      font-size: .95rem;
    }

    .nav-link:hover,.nav-link:focus { color: var(--sage-dark); }

    .btn-agape {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 23px;
      border-radius: 999px;
      border: 0;
      background: var(--sage-dark);
      color: white;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 9px 22px rgba(85,116,91,.18);
      transition: transform .2s ease, background .2s ease;
    }

    .btn-agape:hover {
      color: white;
      background: var(--sage-deep);
      transform: translateY(-2px);
    }

    .btn-outline-agape {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 21px;
      border: 1px solid rgba(63,93,70,.25);
      border-radius: 999px;
      color: var(--sage-deep);
      text-decoration: none;
      font-weight: 800;
      transition: background .2s ease;
    }

    .btn-outline-agape:hover {
      background: white;
      color: var(--sage-deep);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 70px 0 78px;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(240,216,204,.78), transparent 42%),
        radial-gradient(ellipse at 90% 70%, rgba(220,232,217,.9), transparent 45%),
        var(--cream);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(85,116,91,.12);
      border-radius: 999px;
      color: var(--sage-deep);
      font-weight: 800;
      font-size: .86rem;
    }

    .hero h1 {
      font-size: clamp(2.5rem,5vw,4.4rem);
      font-weight: 900;
      line-height: 1.06;
    }

    .hero-copy {
      color: var(--muted);
      font-size: clamp(1.05rem,1.6vw,1.2rem);
      max-width: 580px;
    }

    .hero-photo-wrap {
      position: relative;
      padding: 0 12px 18px 0;
    }

    .hero-photo {
      display: block;
      width: 100%;
      height: 470px;
      object-fit: cover;
      border-radius: 36px 36px 100px 36px;
      box-shadow: var(--shadow);
    }

    .photo-note {
      position: absolute;
      bottom: 0;
      left: -18px;
      max-width: 245px;
      background: white;
      border-radius: 20px;
      padding: 17px 20px;
      box-shadow: var(--shadow);
      font-weight: 800;
      color: var(--sage-deep);
      line-height: 1.35;
    }

    .photo-note small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      margin-top: 5px;
    }

    .section-space { padding: 82px 0; }

    .section-kicker {
      color: var(--sage-dark);
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: .76rem;
      font-weight: 900;
    }

    .section-title {
      font-weight: 900;
      font-size: clamp(2rem,4vw,3rem);
      line-height: 1.15;
    }

    .section-intro {
      max-width: 690px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.07rem;
    }

    .value-card,.service-card {
      background: white;
      border: 1px solid rgba(85,116,91,.08);
      border-radius: var(--radius);
      overflow: hidden;
      height: 100%;
      box-shadow: 0 10px 35px rgba(67,75,61,.045);
      transition: transform .22s ease, box-shadow .22s ease;
    }

    .value-card:hover,.service-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .value-card { padding: 28px; }

    .value-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--sage);
      font-size: 1.5rem;
      margin-bottom: 18px;
    }

    .service-photo {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .service-content { padding: 27px; }

    .service-content h3 {
      font-size: 1.45rem;
      font-weight: 900;
    }

    .service-content p { color: var(--muted); }

    .tag {
      display: inline-block;
      padding: 7px 11px;
      margin: 4px 4px 0 0;
      border-radius: 999px;
      background: var(--cream);
      color: var(--sage-deep);
      font-size: .82rem;
      font-weight: 700;
    }

    .professional-card {
      background: white;
      border: 1px solid rgba(85,116,91,.10);
      border-radius: 22px;
      padding: 24px;
      height: 100%;
      box-shadow: 0 10px 30px rgba(67,75,61,.04);
    }

    .professional-card h3 {
      font-size: 1.08rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .professional-card p {
      margin: 0;
      color: var(--muted);
    }

    .community {
      border-radius: 34px;
      padding: clamp(30px,5vw,60px);
      background: linear-gradient(125deg,#f1ded4,#e4eddf);
      overflow: hidden;
      position: relative;
    }

    .community-photo {
      width: 100%;
      height: 310px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(67,75,61,.12);
    }

    .contact-section { background: #f3e8de; }

    .contact-card {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(85,116,91,.08);
      border-radius: 28px;
      padding: clamp(24px,4vw,38px);
      height: 100%;
    }

    .contact-line {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin: 18px 0;
    }

    .contact-icon {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--sage);
      border-radius: 14px;
    }

    .map-frame {
      width: 100%;
      height: 100%;
      min-height: 370px;
      border: 0;
      border-radius: 24px;
    }

    footer {
      background: var(--sage-deep);
      color: rgba(255,255,255,.82);
    }

    footer a { color: white; }
    .footer-brand { color: white; font-weight: 900; }

    .floating-whatsapp {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1000;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #25d366;
      color: white;
      text-decoration: none;
      font-size: 1.65rem;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
      transition: transform .2s ease;
    }

    .floating-whatsapp:hover {
      color: white;
      transform: scale(1.06);
    }

    .small-note { color: var(--muted); font-size: .86rem; }

    @media (max-width: 991.98px) {
      .hero { padding: 52px 0 62px; }
      .hero-photo { height: 390px; }
      .photo-note { left: 8px; }
    }

    @media (max-width: 575.98px) {
      .hero h1 { font-size: 2.45rem; }
      .hero-photo {
        height: 310px;
        border-radius: 28px 28px 70px 28px;
      }
      .photo-note {
        position: relative;
        left: auto;
        bottom: auto;
        margin: -25px 12px 0;
      }
      .section-space { padding: 60px 0; }
      .service-photo { height: 205px; }
      .map-frame { min-height: 290px; }
      .btn-agape,.btn-outline-agape { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *,*::before,*::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

    </div>
