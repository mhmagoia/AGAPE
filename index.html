<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f2">
  <meta name="description" content="Espacio Ágape, consultorios interdisciplinarios en Colón, Buenos Aires.">
  <title>Espacio Ágape | Consultorios Interdisciplinarios</title>

  <!-- Bootstrap 5, Google Fonts y FontAwesome para íconos -->
  <link href="https://jsdelivr.net" rel="stylesheet">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    :root {
      --cream: #fbf7f2;
      --cream-deep: #f3e8de;
      --pink: #f0d8cc;
      --sage: #dce8d9;
      --sage-dark: #55745b;
      --sage-deep: #3f5d46;
      --ink: #443e38;
      --muted: #756f69;
      --white: #fff;
      --shadow: 0 18px 50px rgba(67,75,61,.09);
      --radius: 26px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.7;
    }

    h1,h2,h3,h4,.navbar-brand { font-family: "Nunito", sans-serif; }
    h1,h2,h3,h4 { color: var(--sage-deep); letter-spacing: -.025em; }
    a { color: var(--sage-dark); text-decoration: none; }
    a:hover { color: var(--sage-deep); }

    .navbar {
      background: rgba(251,247,242,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(85,116,91,.08);
    }

    .navbar-brand {
      color: var(--sage-deep);
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: var(--sage);
      margin-right: 8px;
      font-size: 1.2rem;
    }

    .nav-link {
      color: var(--ink);
      font-weight: 700;
      font-size: .95rem;
    }

    .nav-link:hover, .nav-link:focus { color: var(--sage-dark); }

    .btn-agape {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 28px;
      border-radius: 999px;
      border: 0;
      background: var(--sage-dark);
      color: white !important;
      font-weight: 800;
      box-shadow: 0 9px 22px rgba(85,116,91,.18);
      transition: transform .2s ease, background .2s ease;
    }

    .btn-agape:hover {
      background: var(--sage-deep);
      transform: translateY(-2px);
    }

    .btn-outline-agape {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 21px;
      border: 1px solid rgba(63,93,70,.25);
      border-radius: 999px;
      color: var(--sage-deep);
      font-weight: 800;
      transition: background .2s ease;
    }

    .btn-outline-agape:hover {
      background: white;
      color: var(--sage-deep);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 80px 0 90px;
      background:
        radial-gradient(ellipse at 8% 12%, rgba(240,216,204,.78), transparent 42%),
        radial-gradient(ellipse at 90% 70%, rgba(220,232,217,.9), transparent 45%),
        var(--cream);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(85,116,91,.12);
      border-radius: 999px;
      color: var(--sage-deep);
      font-weight: 800;
      font-size: .86rem;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 4.5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .hero-copy {
      color: var(--muted);
      font-size: clamp(1.05rem, 1.6vw, 1.2rem);
      max-width: 580px;
    }

    .hero-photo-wrap { position: relative; padding: 0 12px 18px 0; }

    .hero-photo {
      display: block;
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 36px 36px 100px 36px;
      box-shadow: var(--shadow);
    }

    .photo-note {
      position: absolute;
      bottom: -10px;
      left: -18px;
      max-width: 250px;
      background: white;
      border-radius: 20px;
      padding: 17px 20px;
      box-shadow: var(--shadow);
      font-weight: 800;
      color: var(--sage-deep);
      line-height: 1.35;
    }

    .photo-note small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      margin-top: 5px;
    }

    .section-space { padding: 80px 0; }

    .section-kicker {
      color: var(--sage-dark);
      text-transform: uppercase;
      letter-spacing: .13em;
      font-size: .76rem;
      font-weight: 900;
      display: block;
      margin-bottom: 10px;
    }

    .section-title {
      font-weight: 900;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.15;
    }

    .service-card {
      background: white;
      border: 1px solid rgba(85,116,91,.08);
      border-radius: var(--radius);
      overflow: hidden;
      height: 100%;
      box-shadow: 0 10px 35px rgba(67,75,61,.045);
      transition: transform .22s ease, box-shadow .22s ease;
      margin-bottom: 24px;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
    }

    .service-photo {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .service-content { padding: 30px; }
    .service-content h3 { font-size: 1.5rem; font-weight: 900; margin-bottom: 15px; }
    .service-content p { color: var(--muted); margin-bottom: 20px; }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      margin: 4px 4px 4px 0;
      border-radius: 999px;
      background: var(--cream);
      color: var(--sage-deep);
      font-size: .85rem;
      font-weight: 700;
    }

    .community {
      border-radius: 34px;
      padding: clamp(30px, 5vw, 60px);
      background: linear-gradient(125deg, #f1ded4, #e4eddf);
      box-shadow: var(--shadow);
    }

    .community-photo {
      width: 100%;
      height: 330px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(67,75,61,.12);
    }

    .contact-section { background: #f3e8de; }

    .contact-card {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(85,116,91,.08);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 38px);
      height: 100%;
    }

    .contact-line {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin: 20px 0;
    }

    .contact-icon {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--sage);
      border-radius: 14px;
      color: var(--sage-dark);
      font-size: 1.1rem;
    }

    .map-frame {
      width: 100%;
      height: 100%;
      min-height: 380px;
      border: 0;
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    footer { background: var(--sage-deep); color: rgba(255,255,255,.82); }
    footer a { color: white; }
    .footer-brand { color: white; font-weight: 900; }

    .floating-whatsapp {
      position: fixed;
      right: 25px;
      bottom: 25px;
      z-index: 1000;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white !important;
      font-size: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }
    .floating-whatsapp:hover { transform: scale(1.1); background-color: #1ebd58; }
  </style>
</head>
<body>

  <!-- Menú de Navegación -->
  <nav class="navbar navbar-expand-lg sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="brand-mark">🌱</span> Espacio Ágape
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2 text-center align-items-center mt-3 mt-lg-0">
          <li class="nav-item"><a class="nav-link px-3" href="#inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#servicios">Servicios</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#talleres">Talleres</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="#contacto">Contacto</a></li>
          <li class="nav-item ms-lg-2">
            <a href="https://wa.me" target="_blank" class="btn-agape"><i class="fab fa-whatsapp"></i> Turnos</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Sección Principal (Hero) -->
  <section id="inicio" class="hero d-flex align-items-center">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-6 text-center text-lg-start">
          <div class="eyebrow">
            <span>📍</span> Colón, Buenos Aires
          </div>
          <h1 class="mb-4">Un espacio integral para el desarrollo, salud y educación</h1>
          <p class="hero-copy mb-5 mx-auto mx-lg-0">Acompañamos a niños, adolescentes, adultos y sus familias desde una mirada respetuosa, profesional e interdisciplinaria.</p>
          <div class="d-flex flex-column flex-sm-row justify-content-center justify-content-lg-start gap-3">
